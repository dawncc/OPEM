<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>{% block title %}OPEM{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f5f7;
      --surface: rgba(255,255,255,.88);
      --surface-solid: #fff;
      --surface-muted: #f7f7f9;
      --ink: #1d1d1f;
      --secondary: #6e6e73;
      --tertiary: #7d7d82;
      --line: rgba(60,60,67,.12);
      --line-strong: rgba(60,60,67,.2);
      --blue: #0071e3;
      --blue-hover: #0077ed;
      --purple: #7c5cff;
      --green: #24a148;
      --orange: #e8791c;
      --red: #d83a52;
      --shadow: 0 1px 2px rgba(0,0,0,.03), 0 12px 32px rgba(0,0,0,.055);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }
    * { box-sizing: border-box; }
    html { background: var(--canvas); -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% -10%, rgba(124,92,255,.09), transparent 33rem),
        radial-gradient(circle at 90% 10%, rgba(0,113,227,.07), transparent 32rem),
        var(--canvas);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { color: var(--blue-hover); }
    :focus-visible { outline: 3px solid rgba(0,113,227,.38); outline-offset: 3px; }
    .skip-link { position: fixed; top: 8px; left: 10px; z-index: 100; padding: 9px 13px; border-radius: 9px; background: var(--ink); color: white; transform: translateY(-150%); }
    .skip-link:focus { color: white; transform: translateY(0); }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      border-bottom: 1px solid rgba(60,60,67,.08);
      background: rgba(250,250,252,.78);
      backdrop-filter: saturate(180%) blur(22px);
      -webkit-backdrop-filter: saturate(180%) blur(22px);
    }
    .nav-inner {
      max-width: 1180px; min-height: 58px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); font-weight: 680; letter-spacing: -.01em; }
    .brand:hover { color: var(--ink); }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
      background: linear-gradient(145deg,#27272a,#050505); box-shadow: inset 0 1px rgba(255,255,255,.22), 0 4px 12px rgba(0,0,0,.18);
    }
    .brand-mark span { width: 4px; height: 4px; border-radius: 50%; background: white; box-shadow: 7px 0 #8cbcff, -7px 0 #bba9ff; }
    .nav-links { display: flex; align-items: center; gap: 5px; }
    .nav-link { color: var(--secondary); font-size: 13px; font-weight: 560; padding: 7px 12px; border-radius: 10px; transition: .18s ease; }
    .nav-link:hover { color: var(--ink); background: rgba(0,0,0,.04); }
    .nav-link.active { color: var(--ink); background: rgba(0,0,0,.06); }
    .page { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 54px 0 72px; }
    .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; margin-bottom: 32px; }
    .hero-copy { max-width: 760px; }
    .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    .page-title { margin-bottom: 10px; font-size: clamp(34px,5vw,54px); line-height: 1.06; letter-spacing: -.045em; font-weight: 720; }
    .detail-title { font-size: clamp(29px,4vw,44px); overflow-wrap: anywhere; }
    .subtitle { margin: 0; color: var(--secondary); font-size: 16px; line-height: 1.55; }
    .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .button {
      appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 38px; padding: 8px 15px; border: 1px solid var(--line); border-radius: 11px;
      background: rgba(255,255,255,.78); color: var(--ink); font: inherit; font-weight: 590; cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.03); transition: .18s ease;
    }
    .button:hover { color: var(--ink); background: #fff; border-color: var(--line-strong); transform: translateY(-1px); }
    .button.primary { color: white; background: var(--blue); border-color: var(--blue); }
    .button.primary:hover { color: white; background: var(--blue-hover); }
    .button.icon { width: 38px; padding: 0; font-size: 18px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 12px; margin-bottom: 30px; }
    .stat-card {
      position: relative; min-height: 132px; padding: 20px; overflow: hidden;
      background: var(--surface); border: 1px solid rgba(255,255,255,.7); border-radius: var(--radius-lg); box-shadow: var(--shadow);
    }
    .stat-label { display: block; margin-bottom: 20px; color: var(--secondary); font-size: 13px; font-weight: 560; }
    .stat-value { display: block; font-size: 34px; line-height: 1; letter-spacing: -.04em; font-weight: 690; }
    .stat-dot { position: absolute; top: 19px; right: 19px; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 5px rgba(0,113,227,.1); }
    .stat-card:nth-child(2) .stat-dot { background: var(--purple); box-shadow: 0 0 0 5px rgba(124,92,255,.1); }
    .stat-card:nth-child(3) .stat-dot { background: var(--green); box-shadow: 0 0 0 5px rgba(36,161,72,.1); }
    .stat-card:nth-child(4) .stat-dot { background: var(--orange); box-shadow: 0 0 0 5px rgba(232,121,28,.1); }
    .stat-card:nth-child(5) .stat-dot { background: var(--tertiary); box-shadow: 0 0 0 5px rgba(142,142,147,.1); }
    .layout-two { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(280px,.75fr); gap: 18px; align-items: start; }
    .section {
      margin-bottom: 18px; padding: 24px; background: var(--surface); border: 1px solid rgba(255,255,255,.72);
      border-radius: var(--radius-xl); box-shadow: var(--shadow); overflow: hidden;
    }
    .section.flush { padding: 0; }
    .section-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .section.flush .section-header { margin: 0; padding: 22px 24px 12px; }
    .section-title { margin: 0; font-size: 19px; line-height: 1.25; letter-spacing: -.025em; font-weight: 670; }
    .section-note { color: var(--tertiary); font-size: 12px; }
    .project-list { display: grid; gap: 9px; }
    .project-link, .list-row {
      display: flex; align-items: center; justify-content: space-between; gap: 15px; min-width: 0;
      padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(255,255,255,.56); color: var(--ink); transition: .18s ease;
    }
    .project-link:hover, .list-row:hover { color: var(--ink); border-color: rgba(0,113,227,.28); background: #fff; transform: translateY(-1px); }
    .project-name, .row-title { min-width: 0; font-weight: 610; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chevron { color: var(--tertiary); font-size: 18px; }
    .badge, .tag {
      display: inline-flex; align-items: center; width: fit-content; max-width: 100%; padding: 3px 9px; border-radius: 999px;
      background: rgba(0,113,227,.08); color: #0066cc; font-size: 11px; font-weight: 650; line-height: 1.45;
    }
    .badge[data-type="decision"] { background: rgba(124,92,255,.1); color: #6847e5; }
    .badge[data-type="solution"], .badge[data-type="learning"] { background: rgba(36,161,72,.1); color: #16753a; }
    .badge[data-type="problem"] { background: rgba(216,58,82,.1); color: #b62d43; }
    .badge[data-type="session_summary"] { background: rgba(232,121,28,.1); color: #b85d12; }
    .tag { margin: 3px 4px 3px 0; color: var(--secondary); background: rgba(118,118,128,.09); font-weight: 560; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 16px; color: var(--tertiary); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; font-weight: 650; text-align: left; border-bottom: 1px solid var(--line); }
    td { padding: 15px 16px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .15s ease; }
    tbody tr:hover { background: rgba(0,113,227,.025); }
    .table-title { color: var(--ink); font-weight: 590; }
    .table-title:hover { color: var(--blue); }
    .nowrap { white-space: nowrap; }
    .muted { color: var(--secondary); }
    .faint { color: var(--tertiary); }
    .content { white-space: pre-wrap; overflow-wrap: anywhere; }
    .observation-list, .result-list, .source-list { display: grid; gap: 10px; }
    .observation { padding: 15px 16px; border-radius: var(--radius-md); background: var(--surface-muted); border: 1px solid var(--line); }
    .observation-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 9px; }
    .observation p { margin: 0; }
    .breadcrumb { display: flex; align-items: center; gap: 7px; margin-bottom: 15px; color: var(--tertiary); font-size: 13px; }
    .breadcrumb a { color: var(--secondary); }
    .metadata { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
    .meta-chip { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.6); color: var(--secondary); font-size: 12px; }
    .memory-body { padding: 22px; border-radius: var(--radius-lg); background: linear-gradient(145deg,#fafaff,#f7f8fb); border: 1px solid var(--line); font-size: 15px; line-height: 1.72; }
    .search-panel { padding: 10px; margin-bottom: 24px; border-radius: 17px; background: rgba(255,255,255,.84); border: 1px solid rgba(255,255,255,.8); box-shadow: var(--shadow); }
    .search-form { display: grid; grid-template-columns: minmax(0,1fr) 210px auto; gap: 8px; }
    input, select {
      min-width: 0; min-height: 43px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 11px;
      background: rgba(247,247,249,.8); color: var(--ink); font: inherit; outline: none; transition: .16s ease;
    }
    input:focus, select:focus { background: #fff; border-color: rgba(0,113,227,.48); box-shadow: 0 0 0 4px rgba(0,113,227,.09); }
    .result-card { display: block; padding: 20px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid rgba(255,255,255,.75); box-shadow: var(--shadow); color: var(--ink); }
    .result-card:hover { color: var(--ink); }
    .result-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 11px; }
    .result-title { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 650; }
    .result-snippet { color: #424245; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .empty-state { padding: 38px 20px; text-align: center; color: var(--secondary); }
    .empty-icon { width: 48px; height: 48px; margin: 0 auto 13px; display: grid; place-items: center; border-radius: 15px; background: rgba(118,118,128,.08); font-size: 21px; }
    .chat-list { display: grid; gap: 12px; }
    .chat-message { max-width: 88%; padding: 15px 17px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface-muted); }
    .chat-message.role-user { margin-left: auto; border-bottom-right-radius: 6px; background: #eaf3ff; border-color: rgba(0,113,227,.12); }
    .chat-message.role-assistant { margin-right: auto; border-bottom-left-radius: 6px; background: #fff; }
    .chat-message.role-system, .chat-message.role-tool { max-width: 100%; background: #fff9ef; border-color: rgba(232,121,28,.16); }
    .chat-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; color: var(--tertiary); font-size: 11px; }
    .turn-nav { display: flex; gap: 7px; padding-bottom: 4px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: thin; }
    .turn-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.65); color: var(--secondary); font-size: 12px; }
    .turn-chip:hover { color: var(--ink); background: white; }
    .conversation-turn { margin-bottom: 12px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: rgba(255,255,255,.48); overflow: hidden; }
    .conversation-turn:last-child { margin-bottom: 0; }
    .conversation-turn > summary { display: flex; align-items: center; gap: 13px; padding: 15px 17px; cursor: pointer; list-style: none; user-select: none; }
    .conversation-turn > summary::-webkit-details-marker { display: none; }
    .conversation-turn > summary::after { content: "⌄"; margin-left: auto; color: var(--tertiary); font-size: 17px; transition: transform .18s ease; }
    .conversation-turn:not([open]) > summary::after { transform: rotate(-90deg); }
    .turn-number { flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; color: var(--blue); background: rgba(0,113,227,.09); font-size: 12px; font-weight: 720; }
    .turn-heading { min-width: 0; flex: 1; }
    .turn-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 630; }
    .turn-tags { display: flex; gap: 5px; margin-top: 4px; }
    .turn-tag { padding: 2px 7px; border-radius: 999px; color: var(--secondary); background: rgba(118,118,128,.09); font-size: 10px; font-weight: 650; }
    .turn-tag.code { color: #6847e5; background: rgba(124,92,255,.1); }
    .turn-tag.tool { color: #126f38; background: rgba(36,161,72,.1); }
    .turn-tag.error { color: #b62d43; background: rgba(216,58,82,.1); }
    .turn-body { padding: 2px 16px 16px; border-top: 1px solid var(--line); }
    .message-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .message-text + .message-text { margin-top: 10px; }
    .code-block { margin: 12px 0 2px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); border-radius: 13px; background: #1d1d20; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
    .code-toolbar { min-height: 34px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; color: #a1a1a6; background: #29292c; font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .window-dots { display: flex; gap: 5px; }
    .window-dots i { width: 7px; height: 7px; border-radius: 50%; background: #ff5f57; }
    .window-dots i:nth-child(2) { background: #febc2e; }.window-dots i:nth-child(3) { background: #28c840; }
    .code-block pre, .tool-output { max-height: 34rem; margin: 0; padding: 16px; overflow: auto; color: #f2f2f7; background: transparent; font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; tab-size: 4; white-space: pre; }
    .tool-card { max-width: 100%; margin: 12px 0; padding: 0; overflow: hidden; border: 1px solid rgba(36,161,72,.2); border-radius: 14px; background: #151a17; color: #eefbf2; }
    .tool-header { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border-bottom: 1px solid rgba(255,255,255,.08); background: #1d251f; font-size: 12px; }
    .tool-status { width: 8px; height: 8px; border-radius: 50%; background: #28c840; box-shadow: 0 0 0 4px rgba(40,200,64,.1); }
    .tool-card.failed { border-color: rgba(216,58,82,.28); }.tool-card.failed .tool-status { background: #ff5f57; box-shadow: 0 0 0 4px rgba(255,95,87,.1); }
    .tool-card.unknown { border-color: rgba(232,121,28,.25); }.tool-card.unknown .tool-status { background: #febc2e; box-shadow: 0 0 0 4px rgba(254,188,46,.1); }
    .tool-name { font-weight: 650; }.tool-state { margin-left: auto; color: #a4ada7; font-size: 10px; text-transform: uppercase; }
    .archive-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .archive-card { min-width: 0; padding: 17px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.58); }
    .archive-card.failed { border-color: rgba(216,58,82,.18); background: rgba(255,247,248,.8); }
    .archive-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
    .archive-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .status-badge { margin-left: auto; padding: 3px 8px; border-radius: 999px; background: rgba(118,118,128,.09); color: var(--secondary); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .status-badge.success { color: #16753a; background: rgba(36,161,72,.1); }.status-badge.failed { color: #b62d43; background: rgba(216,58,82,.1); }.status-badge.unknown { color: #a85a18; background: rgba(232,121,28,.1); }
    .archive-output { max-height: 8.5rem; overflow: auto; margin: 10px 0 0; padding: 11px; border-radius: 10px; background: rgba(118,118,128,.07); font: 11px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .archive-input { margin: 10px 0 0; padding: 10px 11px; border-left: 3px solid rgba(0,113,227,.24); border-radius: 8px; background: rgba(0,113,227,.045); font: 11px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .archive-name, .archive-meta, .execution-profile > span { overflow-wrap: anywhere; }
    .archive-meta, .archive-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; color: var(--secondary); font-size: 12px; }
    .archive-actions { justify-content: space-between; margin-top: 13px; }
    .archive-reason { margin: 12px 0 0; line-height: 1.65; }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.62); color: var(--secondary); font-size: 12px; font-weight: 590; }
    .filter-pill:hover, .filter-pill.active { color: var(--ink); background: white; border-color: rgba(0,113,227,.25); }
    .filter-count { min-width: 20px; padding: 1px 6px; border-radius: 999px; background: rgba(118,118,128,.09); text-align: center; font-size: 10px; }
    .tool-aggregate { margin-bottom: 18px; padding: 20px; border: 1px solid rgba(0,113,227,.13); border-radius: var(--radius-xl); background: linear-gradient(135deg,rgba(246,250,255,.94),rgba(255,255,255,.82)); box-shadow: var(--shadow); }
    .tool-aggregate-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 15px; }
    .tool-aggregate-head h2 { margin: 1px 0 0; font-size: 20px; letter-spacing: -.025em; }
    .tool-aggregate-head > span { color: var(--tertiary); font-size: 11px; }
    .tool-summary-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 9px; }
    .tool-summary-card { min-width: 0; padding: 14px 15px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.82); }
    .tool-summary-card span, .tool-summary-card small { display: block; color: var(--secondary); font-size: 11px; }
    .tool-summary-card strong { display: block; margin: 5px 0 3px; font-size: 25px; letter-spacing: -.04em; }
    .tool-summary-card.primary strong { color: var(--blue); }.tool-summary-card.success strong { color: #16753a; }.tool-summary-card.failed strong { color: #b62d43; }.tool-summary-card.unknown strong { color: #a85a18; }
    .tool-controls { display: grid; gap: 14px; }
    .tool-search-form { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; }
    .tool-facet-form { display: grid; grid-template-columns: repeat(4,minmax(130px,1fr)) auto auto; gap: 8px; align-items: end; padding: 12px; border: 1px solid rgba(0,113,227,.1); border-radius: 13px; background: rgba(0,113,227,.035); }
    .tool-facet-form label { min-width: 0; }
    .tool-facet-form label > span { display: block; margin: 0 0 5px 2px; color: var(--secondary); font-size: 10px; font-weight: 650; }
    .tool-facet-form select { width: 100%; }
    .tool-filter-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .view-toggle { display: flex; gap: 7px; }
    .tool-group-list { display: grid; gap: 12px; }
    .tool-group-card { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.68); box-shadow: 0 6px 22px rgba(31,35,48,.04); }
    .tool-group-card[open] { border-color: rgba(0,113,227,.2); background: rgba(255,255,255,.88); }
    .tool-group-summary { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: center; padding: 17px 19px; cursor: pointer; list-style-position: inside; }
    .tool-group-main { display: inline-flex; min-width: 0; align-items: center; flex-wrap: wrap; gap: 8px; }
    .tool-group-main .archive-meta { flex-basis: 100%; margin-left: 20px; }
    .operation-badge { padding: 3px 8px; border-radius: 7px; color: #315d96; background: rgba(0,113,227,.08); font: 10px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .similarity-badge { padding: 3px 8px; border-radius: 999px; color: #5b4a91; background: rgba(111,88,217,.09); font-size: 10px; font-weight: 680; }
    .tool-group-tags { display: flex; flex-basis: 100%; flex-wrap: wrap; gap: 5px; margin-left: 20px; }
    .tool-tag { display: inline-flex; max-width: 180px; padding: 2px 7px; overflow: hidden; border-radius: 999px; color: #55555c; background: rgba(118,118,128,.08); font: normal 10px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-overflow: ellipsis; white-space: nowrap; }
    .tool-tag.language { color: #16753a; background: rgba(36,161,72,.09); }
    .tool-group-metrics { display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 6px; }
    .group-count { color: var(--ink); font-size: 13px; font-weight: 680; }
    .tool-group-body { padding: 0 18px 18px; border-top: 1px solid var(--line); }
    .tool-group-context { padding: 12px 2px; color: var(--secondary); font-size: 11px; }
    .tool-group-context > span + span { margin-left: 6px; }
    .group-execution-list { display: grid; gap: 9px; }
    .group-execution { min-width: 0; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(248,248,250,.72); }
    .group-execution.failed { border-color: rgba(216,58,82,.16); background: rgba(255,247,248,.75); }
    .execution-profile { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 8px 0; color: var(--secondary); font-size: 10px; }
    .execution-profile > span { margin-right: 2px; font-weight: 650; }
    .tool-group-more { padding: 11px 13px; border: 1px dashed rgba(0,113,227,.18); border-radius: 10px; color: var(--secondary); background: rgba(0,113,227,.035); font-size: 11px; }
    .tool-group-more a { margin-left: 5px; font-weight: 650; }
    .faq-list { display: grid; gap: 13px; }
    .faq-card { padding: 21px; border: 1px solid rgba(216,58,82,.14); border-radius: var(--radius-lg); background: rgba(255,255,255,.78); box-shadow: var(--shadow); }
    .faq-question { margin: 0 0 13px; font-size: 17px; font-weight: 670; }.faq-answer { padding: 14px; border-radius: 12px; background: #fff7f8; line-height: 1.7; }
    .faq-evidence { margin-top: 12px; padding: 12px 14px; border-left: 3px solid rgba(216,58,82,.26); border-radius: 9px; background: rgba(216,58,82,.045); }
    .trace-stats { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 10px; margin-bottom: 24px; }
    .trace-stat { padding: 16px 17px; border: 1px solid rgba(255,255,255,.78); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .trace-stat span { display: block; color: var(--secondary); font-size: 11px; font-weight: 620; }
    .trace-stat strong { display: block; margin-top: 5px; font-size: 23px; letter-spacing: -.035em; }
    .trace-list { display: grid; gap: 11px; }
    .trace-session-card { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(330px,.75fr) auto; gap: 20px; align-items: center; padding: 18px 19px; color: var(--ink); border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.6); transition: .18s ease; }
    .trace-session-card:hover { color: var(--ink); border-color: rgba(0,113,227,.28); background: white; transform: translateY(-1px); }
    .trace-session-title { margin: 0 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 660; }
    .trace-session-meta, .trace-inline-metrics { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: var(--secondary); font-size: 12px; }
    .trace-inline-metrics { justify-content: flex-end; }
    .trace-metric { padding: 5px 8px; border-radius: 9px; background: rgba(118,118,128,.07); white-space: nowrap; }
    .trace-metric.failed { color: #b62d43; background: rgba(216,58,82,.08); }
    .trace-metric.cost { color: #16753a; background: rgba(36,161,72,.09); font-weight: 680; }
    .timing-note { margin: -10px 0 22px; padding: 11px 13px; border: 1px solid rgba(0,113,227,.12); border-radius: 12px; color: #315d88; background: rgba(0,113,227,.045); font-size: 12px; }
    .path-nav { display: flex; gap: 7px; margin: 0 0 16px; overflow-x: auto; scrollbar-width: thin; }
    .path-card { margin-bottom: 17px; padding: 22px; border: 1px solid rgba(255,255,255,.78); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow); }
    .path-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; margin-bottom: 16px; }
    .path-kicker { margin: 0 0 5px; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .path-title { margin: 0; font-size: 18px; line-height: 1.4; letter-spacing: -.02em; }
    .path-summary { flex: 0 0 auto; display: flex; gap: 7px; }
    .path-strip { display: flex; align-items: center; gap: 5px; padding: 12px; margin-bottom: 17px; overflow-x: auto; border-radius: 13px; background: rgba(118,118,128,.055); }
    .path-step { flex: 0 0 auto; padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--secondary); background: white; font-size: 11px; font-weight: 620; }
    .path-step.tool { color: #315d88; border-color: rgba(0,113,227,.18); background: #f5f9ff; }
    .path-arrow { flex: 0 0 auto; color: #b0b0b5; }
    .trace-timeline { position: relative; display: grid; gap: 10px; }
    .trace-timeline::before { content: ""; position: absolute; left: 18px; top: 28px; bottom: 28px; width: 2px; background: var(--line); }
    .trace-event { --event: #8e8e93; position: relative; z-index: 1; display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.76); }
    .trace-event.role-user { --event: var(--blue); }.trace-event.role-assistant { --event: var(--purple); }.trace-event.role-system { --event: #8e8e93; }
    .trace-event.kind-test { --event: #25a244; }.trace-event.kind-shell { --event: #35353a; }.trace-event.kind-file { --event: #e8791c; }.trace-event.kind-search { --event: #6f58d9; }.trace-event.kind-browser { --event: #0071e3; }.trace-event.kind-network { --event: #008f8c; }.trace-event.kind-database { --event: #a055c8; }.trace-event.kind-code { --event: #4d6dc5; }.trace-event.kind-generic { --event: #767680; }
    .trace-event.status-failed { border-color: rgba(216,58,82,.22); background: rgba(255,248,249,.9); }
    .event-marker { width: 36px; height: 36px; display: grid; place-items: center; border: 4px solid white; border-radius: 12px; color: white; background: var(--event); box-shadow: 0 0 0 1px color-mix(in srgb,var(--event) 28%,transparent); font: 700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .event-head { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-bottom: 5px; }
    .event-name { font-weight: 670; }.event-time { color: var(--tertiary); font-size: 11px; }
    .event-kind { padding: 2px 7px; border-radius: 999px; color: var(--event); background: color-mix(in srgb,var(--event) 9%,white); font-size: 10px; font-weight: 700; }
    .event-copy { margin: 0; color: #424245; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .event-command { margin-top: 8px; padding: 7px 9px; border-radius: 8px; color: #4f4f54; background: rgba(118,118,128,.065); font: 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap: anywhere; }
    .duration-pill { align-self: center; padding: 5px 8px; border-radius: 9px; color: #245f99; background: rgba(0,113,227,.08); font-size: 11px; font-weight: 680; white-space: nowrap; }
    .duration-pill.estimated { color: #8a5b1e; background: rgba(232,121,28,.09); }.duration-pill.none { color: var(--tertiary); background: rgba(118,118,128,.07); }
    .calendar-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 26px; }
    .calendar-title { margin: 0; font-size: 30px; letter-spacing: -.035em; }
    .calendar-head, .calendar-grid { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 8px; }
    .calendar-head { padding: 0 4px 8px; text-align: center; color: var(--tertiary); font-size: 11px; font-weight: 650; }
    .calendar-day { min-height: 132px; padding: 10px; background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.86); border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.035); }
    .calendar-day.empty { background: rgba(255,255,255,.25); border-color: transparent; box-shadow: none; }
    .calendar-day.today { border-color: rgba(0,113,227,.45); box-shadow: 0 0 0 3px rgba(0,113,227,.08); }
    .day-number { display: grid; place-items: center; width: 28px; height: 28px; color: var(--ink); font-weight: 650; border-radius: 50%; }
    .today .day-number { color: white; background: var(--blue); }
    .daily-chip { display: block; margin-top: 7px; padding: 8px; border-radius: 10px; background: rgba(0,113,227,.07); color: #174f86; font-size: 11px; line-height: 1.35; overflow: hidden; }
    .daily-chip:hover { color: #174f86; background: rgba(0,113,227,.11); }
    .daily-chip b { display: block; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mobile-weekday { display: none; color: var(--tertiary); font-size: 12px; }
    .daily-grid { display: grid; gap: 16px; }
    .summary-copy { font-size: 15px; line-height: 1.75; }
    @media (max-width: 920px) {
      .stats-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .trace-stats { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .layout-two { grid-template-columns: 1fr; }
      .trace-session-card { grid-template-columns: 1fr auto; }.trace-session-card .trace-inline-metrics { grid-column: 1/-1; justify-content: flex-start; }
      .calendar-day { min-height: 115px; }
      .tool-summary-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .tool-facet-form { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 680px) {
      .nav-inner { padding: 0 16px; gap: 8px; }
      .brand-label { display: none; }
      .nav-links { min-width: 0; overflow-x: auto; scrollbar-width: none; }
      .nav-link { min-height: 44px; padding: 11px 8px; white-space: nowrap; }
      .page { width: min(100% - 28px,1180px); padding: 34px 0 52px; }
      .hero { align-items: flex-start; flex-direction: column; margin-bottom: 24px; }
      .page-title { font-size: 36px; }
      .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
      .stat-card { min-height: 108px; padding: 16px; }
      .stat-label { margin-bottom: 14px; }
      .stat-value { font-size: 29px; }
      .section { padding: 18px; border-radius: 18px; }
      .section.flush .section-header { padding: 18px 18px 8px; }
      .search-form { grid-template-columns: 1fr; }
      .chat-message { max-width: 96%; }
      .conversation-turn > summary { padding: 13px; }
      .turn-body { padding: 2px 11px 12px; }
      .turn-title { max-width: 215px; }
      .archive-grid { grid-template-columns: 1fr; }
      .tool-search-form, .tool-group-summary { grid-template-columns: 1fr; }
      .tool-facet-form { grid-template-columns: 1fr; }
      .tool-group-metrics { justify-content: flex-start; margin-left: 20px; }
      .tool-aggregate-head { align-items: flex-start; flex-direction: column; }
      .tool-summary-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .trace-stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .trace-session-card { grid-template-columns: 1fr; gap: 10px; }
      .trace-session-card .chevron { display: none; }
      .path-card { padding: 17px; }.path-head { flex-direction: column; gap: 10px; }.path-summary { flex-wrap: wrap; }
      .trace-event { grid-template-columns: 38px minmax(0,1fr); }.duration-pill { grid-column: 2; justify-self: start; }
      .calendar-head { display: none; }
      .calendar-grid { grid-template-columns: 1fr; }
      .calendar-day.empty { display: none; }
      .calendar-day:not(.has-memory):not(.today) { display: none; }
      .calendar-day { min-height: auto; }
      .calendar-day .mobile-weekday { display: inline; float: right; margin-top: 5px; }
      .calendar-toolbar { align-items: flex-start; }
      .calendar-title { font-size: 24px; text-align: center; }
      td { padding: 13px 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
      .button:hover, .project-link:hover, .list-row:hover { transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="topbar">
    <nav class="nav-inner" aria-label="主导航">
      <a class="brand" href="/" aria-label="OPEM 首页"><span class="brand-mark"><span></span></span><span class="brand-label">OPEM</span></a>
      <div class="nav-links">
        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" {% if request.url.path == '/' %}aria-current="page"{% endif %} href="/">概览</a>
        <a class="nav-link {% if request.url.path.startswith('/calendar') %}active{% endif %}" {% if request.url.path.startswith('/calendar') %}aria-current="page"{% endif %} href="/calendar">日历</a>
        <a class="nav-link {% if request.url.path.startswith('/search') %}active{% endif %}" {% if request.url.path.startswith('/search') %}aria-current="page"{% endif %} href="/search">搜索</a>
        <a class="nav-link {% if request.url.path.startswith('/traces') %}active{% endif %}" {% if request.url.path.startswith('/traces') %}aria-current="page"{% endif %} href="/traces">Trace</a>
        <a class="nav-link {% if request.url.path.startswith('/evolution') %}active{% endif %}" {% if request.url.path.startswith('/evolution') %}aria-current="page"{% endif %} href="/evolution">演进</a>
        <a class="nav-link {% if request.url.path.startswith('/tools') or request.url.path.startswith('/faq') %}active{% endif %}" {% if request.url.path.startswith('/tools') or request.url.path.startswith('/faq') %}aria-current="page"{% endif %} href="/tools">工具</a>
      </div>
    </nav>
  </header>
  <main class="page" id="main-content">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
